<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialyn Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --line: #e1e0d9; --axis: #c3c2b7;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #e6f0ec;
    --series-1: #2a78d6;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --user-bubble: #eef1f8; --agent-bubble: #eef5f1;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --raised: #1f1f1d; --line: #2c2c2a; --axis: #383835;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --accent: #4fb899; --accent-ink: #0b1b16; --accent-soft: #1b2b26;
      --series-1: #3987e5;
      --user-bubble: #22252e; --agent-bubble: #1c2723;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #1f1f1d; --line: #2c2c2a; --axis: #383835;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --accent: #4fb899; --accent-ink: #0b1b16; --accent-soft: #1b2b26;
    --series-1: #3987e5;
    --user-bubble: #22252e; --agent-bubble: #1c2723;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav.side { border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: 0;
    height: 100vh; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
  .brand { font-weight: 700; font-size: 17px; padding: 4px 10px 16px; letter-spacing: -0.01em; }
  .brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  nav.side a { text-decoration: none; color: var(--ink-2); padding: 8px 10px; border-radius: 8px; }
  nav.side a.active, nav.side a:hover { background: var(--accent-soft); color: var(--ink); }
  nav.side .spacer { flex: 1; }
  nav.side button.link { background: none; border: 0; text-align: left; padding: 8px 10px; color: var(--muted); cursor: pointer; }
  main { padding: 28px 28px 60px; max-width: 1180px; width: 100%; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; border-right: 0;
      border-bottom: 1px solid var(--line); padding: 10px 12px; }
    .brand { padding: 4px 10px; width: 100%; } nav.side .spacer { display: none; }
    main { padding: 20px 16px 48px; }
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 16px; }
  .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-detail { grid-template-columns: 340px minmax(0, 1fr); }
  @media (max-width: 980px) { .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-detail, .cols-2 { grid-template-columns: 1fr; } }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .stat .value { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .label { color: var(--ink-2); }
  .stat .hint { color: var(--muted); font-size: 12px; }
  .btn { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.danger { color: var(--critical); }
  .btn:disabled { opacity: .5; cursor: default; }
  input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 90px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
  label.field { display: grid; gap: 4px; color: var(--ink-2); font-size: 13px; }
  label.field .help { color: var(--muted); font-size: 12px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--raised); }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; background: var(--surface); }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  td .muted, .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.good::before { background: var(--good); } .status.critical::before { background: var(--critical); }
  .status.serious::before { background: var(--serious); } .status.live::before { background: var(--series-1); }
  .chip { display: inline-block; background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 32px 12px; }
  /* charts */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid-line { stroke: var(--line); stroke-width: 1; }
  .chart .baseline { stroke: var(--axis); stroke-width: 1; }
  .chart .tick { fill: var(--muted); font-size: 11px; }
  .chart .bar { fill: var(--series-1); }
  .chart .bar.hover { opacity: .8; }
  .tooltip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; z-index: 2; }
  .tooltip strong { display: block; }
  .hbars { display: grid; gap: 8px; }
  .hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 36px; gap: 10px; align-items: center; }
  .hbar .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { height: 10px; background: var(--surface); border-radius: 4px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .count { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  /* detail */
  dl.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .transcript { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; }
  .msg { padding: 9px 12px; border-radius: 12px; max-width: 85%; }
  .msg.user { background: var(--user-bubble); align-self: flex-end; }
  .msg.assistant { background: var(--agent-bubble); align-self: flex-start; }
  .msg small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  ul.timeline { list-style: none; margin: 0; padding: 0; }
  ul.timeline li { display: grid; grid-template-columns: 88px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  ul.timeline time { color: var(--muted); font-variant-numeric: tabular-nums; }
  pre.code { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12.5px; margin: 0; }
  .notice { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }
  .error { color: var(--critical); }
  .login { max-width: 420px; margin: 12vh auto; padding: 0 16px; }
  .login .card { padding: 24px; }
  audio { width: 100%; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page);
    padding: 10px 16px; border-radius: 999px; z-index: 10; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
// ------------------------------------------------------------------ helpers
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
// A dashboard session token (sess_...) or, for power users, an API key (sk_live_...).
let token = store.get("dialyn_token") || store.get("dialyn_api_key");
let account = null, user = null, events = [], refreshTimer = null, welcome = null;
const canManage = () => user && ["owner", "admin"].includes(user.role);

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") throw new Error("no raw html");
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs = {}) { const el = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; }
const label = (v) => (v || "").replaceAll("_", " ");
const fmtDur = (x) => x == null ? "—" : x < 60 ? `${Math.round(x)}s` : `${Math.floor(x / 60)}m ${Math.round(x % 60)}s`;
const fmtTime = (iso) => iso ? new Date(iso).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }

const STATUS_TONE = {
  completed: "good", transferred: "good", unreachable: "critical", failed: "critical",
  busy: "serious", no_answer: "serious", canceled: "", scheduled: "", waiting_for_browser: "live",
  dialing: "live", ringing: "live", in_progress: "live", queued: "",
};
const statusEl = (st) => h("span", { class: `status ${STATUS_TONE[st] ?? ""}` }, label(st));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": `Bearer ${token}`, ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401 && !path.startsWith("/auth/login") && !path.startsWith("/auth/signup")) { signOut(true); throw new Error("Please sign in again."); }
  const data = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (!res.ok) {
    const detail = data?.detail;
    throw new Error(Array.isArray(detail) ? detail.map(d => `${d.loc?.slice(-1)[0]}: ${d.msg}`).join("; ") : detail || `Request failed (${res.status})`);
  }
  return data;
}

// ------------------------------------------------------------------ shell
async function signOut(expired = false) {
  if (!expired && token?.startsWith("sess_")) { try { await fetch("/auth/logout", { method: "POST", headers: { Authorization: `Bearer ${token}` } }); } catch {} }
  token = null; account = null; user = null;
  store.set("dialyn_token", null); store.set("dialyn_api_key", null);
  go("");
}
// Changing the hash already triggers render() via hashchange; render directly only if unchanged.
function go(route) { if (location.hash === route || (!route && !location.hash)) render(); else location.hash = route; }
function signedIn(newToken, route = "#/overview") {
  token = newToken; account = null; user = null; store.set("dialyn_token", token);
  go(route);
}
async function post(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const d = data.detail; throw new Error(Array.isArray(d) ? d.map(x => `${x.loc?.slice(-1)[0]}: ${x.msg}`).join("; ") : d || `Request failed (${res.status})`); }
  return data;
}

function authShell(title, sub, ...content) {
  document.getElementById("root").replaceChildren(h("div", { class: "login" },
    h("h1", {}, title), h("p", { class: "sub" }, sub), h("div", { class: "card" }, ...content)));
}

function renderAuth(mode = "login", error = "") {
  const err = h("p", { class: "error" }, error);
  const tabs = h("div", { class: "row", style: "margin-bottom:14px" },
    ...[["login", "Sign in"], ["signup", "Create store"], ["key", "API key"]].map(([m, t]) =>
      h("button", { class: `btn ${m === mode ? "primary" : ""}`, type: "button", onclick: () => renderAuth(m) }, t)));
  const field = (name, text, attrs = {}) => h("label", { class: "field" }, text, h("input", { name, required: true, ...attrs }));
  let form;
  if (mode === "key") {
    form = h("form", { class: "grid", onsubmit: async (e) => {
      e.preventDefault(); const key = new FormData(form).get("key").trim();
      const res = await fetch("/v1/account", { headers: { Authorization: `Bearer ${key}` } });
      if (res.ok) signedIn(key); else err.textContent = "That API key is not valid.";
    } }, field("key", "Store API key", { type: "password", placeholder: "sk_live_…", autocomplete: "off" }),
      h("span", { class: "muted", style: "font-size:12px" }, "Team, API-key and integration settings need an email sign-in."),
      h("button", { class: "btn primary", type: "submit" }, "Open dashboard"), err);
  } else if (mode === "signup") {
    form = h("form", { class: "grid", onsubmit: async (e) => {
      e.preventDefault(); const d = Object.fromEntries(new FormData(form));
      try { const r = await post("/auth/signup", d); welcome = { api_key: r.api_key, webhook_secret: r.webhook_secret }; signedIn(r.session_token, "#/developers"); }
      catch (x) { err.textContent = x.message; }
    } }, field("brand_name", "Store / brand name", { placeholder: "Kurta Kart" }), field("name", "Your name"),
      field("email", "Work email", { type: "email", autocomplete: "email" }),
      field("password", "Password (8+ characters)", { type: "password", minlength: 8, autocomplete: "new-password" }),
      h("button", { class: "btn primary", type: "submit" }, "Create store"), err);
  } else {
    form = h("form", { class: "grid", onsubmit: async (e) => {
      e.preventDefault();
      try { signedIn((await post("/auth/login", Object.fromEntries(new FormData(form)))).session_token); }
      catch (x) { err.textContent = x.message; }
    } }, field("email", "Email", { type: "email", autocomplete: "email" }),
      field("password", "Password", { type: "password", autocomplete: "current-password" }),
      h("button", { class: "btn primary", type: "submit" }, "Sign in"), err);
  }
  authShell("Dialyn", "AI calling for your store's orders", tabs, form);
}

function renderJoin(inviteToken) {
  const err = h("p", { class: "error" });
  const form = h("form", { class: "grid", onsubmit: async (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(form));
    try { signedIn((await post("/auth/accept-invite", { token: inviteToken, ...d })).session_token); }
    catch (x) { err.textContent = x.message; }
  } }, h("label", { class: "field" }, "Your name", h("input", { name: "name", required: true })),
    h("label", { class: "field" }, "Choose a password (8+ characters)", h("input", { name: "password", type: "password", minlength: 8, required: true, autocomplete: "new-password" })),
    h("button", { class: "btn primary", type: "submit" }, "Join the team"), err);
  authShell("Join your team", "You've been invited to a store on Dialyn.", form);
}

const NAV = [["overview", "Overview"], ["calls", "Calls"], ["new", "New call"], ["integrations", "Integrations"],
  ["voice", "Voice & greetings"], ["team", "Team"], ["settings", "Settings"], ["developers", "Developers"]];

async function render() {
  clearInterval(refreshTimer);
  const joinMatch = location.hash.match(/^#\/join\/(inv_[\w-]+)/);
  if (joinMatch) return renderJoin(joinMatch[1]);
  if (!token) return renderAuth();
  if (!account) {
    try { const me = await api("/auth/me"); account = me.tenant; user = me.user; }
    catch (x) { return renderAuth("login", x.message); }
  }
  if (!events.length) { try { events = (await api("/v1/events")).data; } catch {} }
  const [route, param] = (location.hash.replace(/^#\//, "").split("?")[0] || "overview").split("/");
  const main = h("main", {}, h("p", { class: "muted" }, "Loading…"));
  const nav = h("nav", { class: "side" },
    h("div", { class: "brand" }, "Dialyn", h("small", {}, account.brand_name)),
    ...NAV.filter(([k]) => k !== "team" || user).map(([k, t]) => h("a", { href: `#/${k}`, class: (route === k || (route === "call" && k === "calls")) ? "active" : "" }, t)),
    h("div", { class: "spacer" }),
    user ? h("div", { class: "muted", style: "padding:4px 10px;font-size:12px" }, `${user.name} · ${user.role}`) : null,
    h("button", { class: "link", onclick: () => signOut() }, "Sign out"));
  document.getElementById("root").replaceChildren(h("div", { class: "app" }, nav, main));
  const pages = { overview: pageOverview, calls: pageCalls, call: pageCall, new: pageNew, settings: pageSettings,
    developers: pageDevelopers, integrations: pageIntegrations, voice: pageVoice, team: pageTeam };
  try { await (pages[route] || pageOverview)(main, param); }
  catch (x) { main.replaceChildren(h("p", { class: "error" }, x.message)); }
}
window.addEventListener("hashchange", render);

function needsManager(main, title) {
  main.replaceChildren(h("h1", {}, title), h("p", { class: "notice" },
    user ? "Only owners and admins can change this." : "Sign in with your email (not an API key) to manage this."));
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { toast("Select the text and copy it"); } }
const secretBox = (value) => h("div", { class: "row" }, h("code", { style: "overflow-wrap:anywhere;flex:1" }, value), h("button", { class: "btn", type: "button", onclick: () => copy(value) }, "Copy"));

// ------------------------------------------------------------------ overview
async function pageOverview(main) {
  const draw = async () => {
    const st = await api("/v1/stats?days=14");
    const t = st.totals;
    const pct = (x) => x == null ? "—" : `${Math.round(x * 100)}%`;
    const outcomes = Object.entries(st.outcome).sort((a, b) => b[1] - a[1]);
    const byEvent = Object.entries(st.event_type).sort((a, b) => b[1] - a[1]);
    main.replaceChildren(
      h("h1", {}, "Overview"), h("p", { class: "sub" }, `Last 14 days · times in ${account.timezone}`),
      h("div", { class: "grid cols-4" },
        statTile("Total calls", t.calls, `${t.pending} pending`),
        statTile("Answer rate", pct(t.answer_rate), `${t.answered} of ${t.finished} finished calls`),
        statTile("Avg. call length", fmtDur(t.avg_duration_secs), "answered calls"),
        statTile("Outcomes recorded", Object.values(st.outcome).reduce((a, b) => a + b, 0), "confirmations, changes, cancels…")),
      h("div", { class: "grid cols-2", style: "margin-top:16px" },
        h("section", { class: "card" }, h("h2", {}, "Calls per day"), dailyChart(st.daily)),
        h("section", { class: "card" }, h("h2", {}, "Outcomes"), hbars(outcomes, "No outcomes yet. They appear after answered calls."))),
      h("div", { class: "grid cols-2", style: "margin-top:16px" },
        h("section", { class: "card" }, h("h2", {}, "By event"), hbars(byEvent.map(([k, v]) => [eventTitle(k), v]), "No calls yet.")),
        h("section", { class: "card" }, h("h2", {}, "By status"), hbars(Object.entries(st.status).sort((a, b) => b[1] - a[1]), "No calls yet."))),
    );
  };
  await draw();
  refreshTimer = setInterval(() => draw().catch(() => {}), 15000);
}
function statTile(name, value, hint) {
  return h("section", { class: "card stat" }, h("div", { class: "label" }, name), h("div", { class: "value" }, value ?? "—"), h("div", { class: "hint" }, hint));
}
const eventTitle = (k) => events.find(e => e.event === k)?.title || label(k);

function hbars(entries, emptyText) {
  if (!entries.length) return h("p", { class: "empty" }, emptyText);
  const max = Math.max(...entries.map(e => e[1]));
  return h("div", { class: "hbars", role: "list" }, entries.map(([name, n]) =>
    h("div", { class: "hbar", role: "listitem", title: `${label(name)}: ${n}` },
      h("span", { class: "name" }, label(name)),
      h("span", { class: "track" }, h("span", { class: "fill", style: `display:block;width:${(n / max) * 100}%` })),
      h("span", { class: "count" }, n))));
}

function dailyChart(daily) {
  const W = 560, H = 200, padL = 28, padB = 24, padT = 8;
  const max = Math.max(1, ...daily.map(d => d.calls));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const bw = (W - padL) / daily.length, barW = Math.max(4, bw - 6);
  const y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Calls per day, last 14 days" });
  for (let v = 0; v <= top; v += step) {

    const tx = s("text", { class: "tick", x: padL - 6, y: y(v) + 4, "text-anchor": "end" }); tx.textContent = v; svg.append(tx);

  const tip = h("div", { class: "tooltip", hidden: true }); wrap.append(tip);
  daily.forEach((d, i) => {
    const x = padL + i * bw + (bw - barW) / 2, h0 = y(0) - y(d.calls);
    if (d.calls) {
      // Rounded top, square base anchored to the baseline.
      const r = Math.min(4, barW / 2, h0);
      svg.append(s("path", { class: "bar", d: `M${x},${y(0)} V${y(d.calls) + r} Q${x},${y(d.calls)} ${x + r},${y(d.calls)} H${x + barW - r} Q${x + barW},${y(d.calls)} ${x + barW},${y(d.calls) + r} V${y(0)} Z` }));
    }
    const date = new Date(d.date + "T00:00:00");
    if (i % 2 === daily.length % 2 || daily.length <= 7) {
      const tx = s("text", { class: "tick", x: x + barW / 2, y: H - 6, "text-anchor": "middle" });
      tx.textContent = date.toLocaleDateString([], { day: "numeric", month: "short" }); svg.append(tx);
    }
    const hit = s("rect", { x: padL + i * bw, y: padT, width: bw, height: H - padT - padB, fill: "transparent" });
    hit.addEventListener("mouseenter", () => {
      tip.replaceChildren(h("strong", {}, date.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })),
        `${d.calls} call${d.calls === 1 ? "" : "s"} · ${d.answered} answered`);
      tip.hidden = false;
      const rect = svg.getBoundingClientRect(), scale = rect.width / W;
      tip.style.left = `${Math.min(rect.width - 150, Math.max(0, (x + barW / 2) * scale - 60))}px`;
      tip.style.top = `${Math.max(0, y(d.calls) * scale - 52)}px`;
    });
    hit.addEventListener("mouseleave", () => (tip.hidden = true));

}

    const c = await api(`/v1/calls/${id}`);
    // Only re-render on real changes, so audio playback and scroll position survive polling.
    const snapshot = JSON.stringify(c);
    if (snapshot === lastSnapshot) return c;
    lastSnapshot = snapshot;
    const o = c.payload?.order || {};
    const facts = [["Customer", c.customer_name], ["Phone", c.to_number], ["Language", c.language === "hi" ? "Hinglish" : "English"],
      ["Order", o.id], ["Amount", o.amount != null ? `${o.amount} ${o.currency || ""}` : null],
      ["Items", (o.items || []).map(i => `${i.quantity || 1} × ${i.name}`).join(", ")], ["Payment", o.payment_method],
      ["Address", o.address], ["Delivery", o.expected_delivery], ["Courier", o.courier], ["Tracking", o.tracking_number],
      ["Attempts", `${c.attempts} of ${c.max_attempts}`], ["Next attempt", ["scheduled"].includes(c.status) ? fmtTime(c.next_attempt_at) : null],
      ["Length", c.duration_secs ? fmtDur(c.duration_secs) : null], ["Ended because", label(c.end_reason)], ["Webhook", c.webhook_status]];

    if (["scheduled", "waiting_for_browser"].includes(c.status)) actions.append(h("button", { class: "btn danger", onclick: async () => {
      try { await api(`/v1/calls/${id}/cancel`, { method: "POST" }); toast("Call canceled"); draw(); } catch (x) { toast(x.message); } } }, "Cancel call"));

    const recording = h("div", {}, h("p", { class: "muted" }, c.has_recording ? "Loading recording…" : "No recording (the call was not answered or recording is off)."));
    const outcome = c.outcome

          h("p", { style: "margin:8px 0 0" }, h("strong", {}, `${label(k)}: `), String(v))))
      : h("p", { class: "muted" }, "No outcome recorded yet.");
    const transcript = (c.transcript || []).length
      ? h("div", { class: "transcript" }, c.transcript.map(m => h("div", { class: `msg ${m.role}` }, h("small", {}, m.role === "user" ? "Customer" : "Agent"), m.text)))
      : h("p", { class: "empty" }, "No conversation yet.");
    const meta = Object.keys(c.metadata || {}).length ? h("section", { class: "card" }, h("h2", {}, "Your metadata"), h("pre", { class: "code" }, JSON.stringify(c.metadata, null, 2))) : null;

    main.replaceChildren(
      h("a", { href: "#/calls" }, "← All calls"),
      h("div", { class: "row", style: "justify-content:space-between;margin:10px 0 18px" },
        h("div", {}, h("h1", {}, `${eventTitle(c.event_type)} · ${c.customer_name || ""}`), h("p", { class: "sub", style: "margin:0" }, `Created ${fmtTime(c.created_at)} · ${c.channel === "web" ? "browser test" : "phone"}`)),
        statusEl(c.status)),
      h("div", { class: "grid cols-detail" },
        h("div", { class: "grid", style: "align-content:start" },
          h("section", { class: "card" }, h("h2", {}, "Outcome"), outcome),
          h("section", { class: "card" }, h("h2", {}, "Details"), h("dl", { class: "facts" }, ...facts.filter(f => f[1]).flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])), actions),
          meta),
        h("div", { class: "grid", style: "align-content:start" },
          h("section", { class: "card" }, h("h2", {}, "Recording"), recording),
          h("section", { class: "card" }, h("h2", {}, "Transcript"), transcript),
          h("section", { class: "card" }, h("h2", {}, "Timeline"), h("ul", { class: "timeline" }, (c.timeline || []).map(t =>
            h("li", {}, h("time", {}, new Date(t.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })), label(t.event))))))));

    if (c.has_recording) {
      try {
        if (!audioUrl) {
          const res = await fetch(`/v1/calls/${id}/recording`, { headers: { Authorization: `Bearer ${token}` } });
          if (!res.ok) throw new Error();
          audioUrl = URL.createObjectURL(await res.blob());

    refreshTimer = setInterval(async () => {
      const latest = await draw().catch(() => null);
      if (latest && ["completed", "transferred", "unreachable", "failed", "canceled"].includes(latest.status)) clearInterval(refreshTimer);

  woocommerce: ["WordPress → WooCommerce → Settings → Advanced → Webhooks → Add webhook.",
    "Add two webhooks, Order created and Order updated (API version v3), delivering to the URL below.",
    "Type any long secret into WooCommerce and paste the same secret here."],
};
async function pageIntegrations(main) {
  const all = await api("/v1/integrations");
  const card = (provider, title) => {
    const cfg = all[provider];
    const msg = h("div");
    const form = h("form", { class: "grid", onsubmit: async (e) => {
      e.preventDefault(); const d = new FormData(form);
      const body = { enabled: d.get("enabled") === "on", default_country_code: d.get("cc"), language: d.get("language") || null,
        events: Object.fromEntries(events.map(ev => [ev.event, d.get(`ev_${ev.event}`) === "on"])) };
      if (d.get("secret")) body.secret = d.get("secret");
      try { all[provider] = await api(`/v1/integrations/${provider}`, { method: "PUT", body: JSON.stringify(body) }); toast(`${title} saved`); render(); }
      catch (x) { msg.replaceChildren(h("p", { class: "error" }, x.message)); }
    } },
      h("ol", { style: "margin:0;padding-left:18px;color:var(--ink-2)" }, INTEGRATION_HELP[provider].map(t => h("li", {}, t))),
      h("div", {}, h("div", { class: "muted", style: "font-size:12px" }, "Webhook URL"), secretBox(cfg.webhook_url)),
      h("label", { class: "field" }, cfg.configured ? "Signing secret (saved — leave empty to keep it)" : "Signing secret",
        h("input", { name: "secret", type: "password", autocomplete: "off", minlength: 8 })),
      h("fieldset", { style: "border:1px solid var(--line);border-radius:8px;padding:10px 12px" }, h("legend", { class: "muted" }, "Call customers for"),
        ...events.map(ev => h("label", { style: "display:flex;gap:8px;align-items:center;padding:3px 0" },
          h("input", { type: "checkbox", name: `ev_${ev.event}`, checked: cfg.events[ev.event], style: "width:auto" }), ev.title))),
      h("div", { class: "form-grid" },
        h("label", { class: "field" }, "Default country code", h("input", { name: "cc", value: cfg.default_country_code, pattern: "\\d{1,3}" }),
          h("span", { class: "help" }, "Used when a phone number has no country code (91 = India)")),
        h("label", { class: "field" }, "Call language", h("select", { name: "language" },
          h("option", { value: "", selected: !cfg.language }, "Store default"), h("option", { value: "en", selected: cfg.language === "en" }, "English"),
          h("option", { value: "hi", selected: cfg.language === "hi" }, "Hinglish")))),
      h("label", { style: "display:flex;gap:8px;align-items:center" }, h("input", { type: "checkbox", name: "enabled", checked: cfg.enabled, style: "width:auto" }), `Turn on ${title} calls`),
      canManage() ? h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, "Save")) : h("p", { class: "muted" }, "Owners and admins can change this."),
      msg);
    return h("section", { class: "card" }, h("div", { class: "row", style: "justify-content:space-between;margin-bottom:8px" },
      h("h2", { style: "margin:0" }, title), h("span", { class: `status ${cfg.enabled ? "good" : ""}` }, cfg.enabled ? "on" : "off")), form);
  };
  main.replaceChildren(h("h1", {}, "Integrations"),
    h("p", { class: "sub" }, "Connect your store once; new orders, payments and deliveries trigger calls automatically. Each order gets at most one call per event."),
    h("div", { class: "grid cols-2" }, card("shopify", "Shopify"), card("woocommerce", "WooCommerce")));
}

// ------------------------------------------------------------------ voice & greetings
async function pageVoice(main) {
  const [catalog, fresh] = await Promise.all([api("/v1/voices"), api("/v1/account")]);
  account = fresh;
  const providers = catalog.providers;
  const player = h("audio", { controls: true, hidden: true, style: "margin-top:10px" });
  let playerUrl = null;
  const play = (blob) => { if (playerUrl) URL.revokeObjectURL(playerUrl); playerUrl = URL.createObjectURL(blob); player.src = playerUrl; player.hidden = false; player.play().catch(() => {}); };

  const DEFAULTS = { en: { provider: "deepgram", voice: "aura-2-thalia-en" }, hi: { provider: "sarvam", voice: "priya" } };
  const langCard = (lang, title) => {
    const current = { ...DEFAULTS[lang], ...((account.voice || {})[lang]?.tts || {}) };
    const provSel = h("select", { "aria-label": "Provider" }, ...Object.entries(providers).map(([k, p]) =>
      h("option", { value: k, selected: current.provider === k }, `${k}${p.configured ? "" : " (no key on server)"}`)));
    const voiceBox = h("div");
    const note = h("p", { class: "muted", style: "font-size:12px;margin:4px 0 0" });
    let voiceInput;
    const drawVoices = () => {
      const p = providers[provSel.value];
      note.textContent = p.note;
      const list = p.voices.filter(v => !v.languages || v.languages.includes(lang));
      voiceInput = list.length
        ? h("select", { "aria-label": "Voice" }, ...list.map(v => h("option", { value: v.id, selected: v.id === current.voice },
            [v.label, v.gender, v.accent].filter(Boolean).join(" · "))))
        : h("input", { placeholder: "Voice ID (paste from the provider's voice library)", value: provSel.value === current.provider ? current.voice || "" : "" });
      voiceBox.replaceChildren(h("label", { class: "field" }, "Voice", voiceInput));
    };
    provSel.onchange = drawVoices; drawVoices();
    const previewBtn = h("button", { class: "btn", type: "button", onclick: async () => {
      previewBtn.disabled = true;
      try {
        const res = await fetch("/v1/voices/preview", { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ provider: provSel.value, voice: voiceInput.value, language: lang }) });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || "Preview failed");
        play(await res.blob());
      } catch (x) { toast(x.message); } finally { previewBtn.disabled = false; }
    } }, "▶ Preview");
    const saveBtn = h("button", { class: "btn primary", type: "button", onclick: async () => {
      const voice = { ...(account.voice || {}) };
      voice[lang] = { ...(voice[lang] || {}), tts: { provider: provSel.value, voice: voiceInput.value, ...(lang === "hi" && provSel.value === "sarvam" ? { language: "hi-IN" } : {}) } };
      try { account = await api("/v1/account", { method: "PATCH", body: JSON.stringify({ voice }) }); toast(`${title} voice saved`); }
      catch (x) { toast(x.message); }
    } }, "Use this voice");
    return h("section", { class: "card" }, h("h2", {}, title),
      h("div", { class: "grid" }, h("label", { class: "field" }, "Provider", provSel), note, voiceBox,
        h("div", { class: "row" }, previewBtn, canManage() || !user ? saveBtn : null)));
  };

  const clipRows = [];
  for (const lang of ["hi", "en"]) for (const ev of events) {
    const key = `${lang}:${ev.event}`, clip = (account.clips || {})[key];
    const fileIn = h("input", { type: "file", accept: ".wav,audio/wav", "aria-label": "WAV file" });
    const textIn = h("input", { placeholder: "Exact words spoken in the recording", value: clip?.text || "", "aria-label": "Transcript" });
    clipRows.push(h("tr", { style: "cursor:default" },
      h("td", {}, ev.title, h("div", { class: "muted" }, lang === "hi" ? "Hinglish" : "English")),
      h("td", {}, clip ? h("span", { class: "status good" }, `${clip.secs}s recorded`) : h("span", { class: "muted" }, "AI voice")),
      h("td", { style: "min-width:220px" }, textIn),
      h("td", { style: "min-width:200px" }, fileIn),
      h("td", { style: "white-space:nowrap" },
        h("button", { class: "btn", onclick: async () => {
          if (!fileIn.files[0] || !textIn.value.trim()) return toast("Choose a WAV file and type what it says");
          const fd = new FormData(); fd.append("file", fileIn.files[0]); fd.append("text", textIn.value.trim());
          const res = await fetch(`/v1/clips/${lang}/${ev.event}`, { method: "PUT", headers: { Authorization: `Bearer ${token}` }, body: fd });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) return toast(data.detail || "Upload failed");
          toast("Recording saved"); render();
        } }, "Upload"), " ",
        clip ? h("button", { class: "btn", onclick: async () => {
          const res = await fetch(`/v1/clips/${lang}/${ev.event}/audio`, { headers: { Authorization: `Bearer ${token}` } });
          if (res.ok) play(await res.blob());
        } }, "▶") : null, " ",
        clip ? h("button", { class: "btn danger", onclick: async () => {
          try { await api(`/v1/clips/${lang}/${ev.event}`, { method: "DELETE" }); toast("Recording removed"); render(); } catch (x) { toast(x.message); }
        } }, "Remove") : null)));
  }

  main.replaceChildren(h("h1", {}, "Voice & greetings"),
    h("p", { class: "sub" }, "Pick how your agent sounds, and optionally record a real person for the opening line."),
    h("div", { class: "grid cols-2" }, langCard("en", "English calls"), langCard("hi", "Hinglish calls")),
    player,
    h("section", { class: "card", style: "margin-top:16px" }, h("h2", {}, "Recorded greetings (human voice)"),
      h("p", {}, "Upload a WAV (16-bit, up to 30 s) of a real person saying the first line. Customers hear the human first, then the AI continues. Keep it generic: no customer name, since it plays on every call."),
      canManage() ? h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, ...["Event", "Now", "What the recording says", "WAV file", ""].map(t => h("th", {}, t)))),
        h("tbody", {}, clipRows))) : h("p", { class: "muted" }, "Sign in as an owner or admin to upload recordings.")));
}

// ------------------------------------------------------------------ team
async function pageTeam(main) {
  if (!user) return needsManager(main, "Team");
  const t = await api("/v1/team");
  const out = h("div");
  const emailIn = h("input", { type: "email", placeholder: "teammate@yourstore.com", required: true, "aria-label": "Email" });
  const roleSel = h("select", { "aria-label": "Role" }, h("option", { value: "member" }, "Member (view calls, create calls)"), h("option", { value: "admin" }, "Admin (also keys, integrations, voice)"));
  const inviteForm = h("form", { class: "row", onsubmit: async (e) => {
    e.preventDefault();
    try { const r = await api("/v1/team/invites", { method: "POST", body: JSON.stringify({ email: emailIn.value, role: roleSel.value }) });
      out.replaceChildren(h("div", { class: "notice", style: "margin-top:12px" }, h("strong", {}, "Send this invite link (works once, 7 days):"), secretBox(location.origin + r.invite_path)));
      emailIn.value = ""; } catch (x) { toast(x.message); }
  } }, h("div", { style: "flex:2;min-width:200px" }, emailIn), h("div", { style: "flex:1;min-width:180px" }, roleSel), h("button", { class: "btn primary", type: "submit" }, "Invite"));
  main.replaceChildren(h("h1", {}, "Team"), h("p", { class: "sub" }, "Everyone who can sign in to this store's dashboard."),
    h("div", { class: "table-wrap" }, h("table", { style: "min-width:560px" },
      h("thead", {}, h("tr", {}, ...["Name", "Email", "Role", "Last sign-in", ""].map(x => h("th", {}, x)))),
      h("tbody", {}, t.members.map(m => h("tr", { style: "cursor:default" }, h("td", {}, m.name, m.id === t.you ? h("span", { class: "muted" }, " (you)") : null),
        h("td", {}, m.email), h("td", {}, h("span", { class: "chip" }, m.role)), h("td", { class: "num" }, fmtTime(m.last_login_at)),
        h("td", {}, user.role === "owner" && m.id !== t.you ? h("button", { class: "btn danger", onclick: async () => {
          try { await api(`/v1/team/members/${m.id}`, { method: "DELETE" }); toast("Removed"); render(); } catch (x) { toast(x.message); }
        } }, "Remove") : null)))))),
    t.invites.length ? h("p", { class: "muted", style: "margin-top:10px" }, `Pending invites: ${t.invites.map(i => `${i.email} (${i.role})`).join(", ")}`) : null,
    canManage() ? h("section", { class: "card", style: "margin-top:16px" }, h("h2", {}, "Invite a teammate"), inviteForm, out) : null);
}

render();
</script>
