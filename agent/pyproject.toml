[project]
name = "ai-calling-agent"
version = "0.1.0"
description = "Real-time AI voice calling agent (Pipecat + FastAPI)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[anthropic,cartesia,deepgram,elevenlabs,groq,openai,runner,sarvam,silero,webrtc,websocket]==1.11.0",
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "twilio>=9.3,<10",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.12.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
